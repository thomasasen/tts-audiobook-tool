name: German Audiobook Studio

on:
  pull_request:
    paths:
      - "tts_audiobook_tool/web_studio/**"
      - "web/**"
      - "tests/web/**"
      - ".github/workflows/german-audiobook-studio.yml"
  push:
    branches:
      - "feature/german-audiobook-studio-*"
    paths:
      - "tts_audiobook_tool/web_studio/**"
      - "web/**"
      - "tests/web/**"
      - ".github/workflows/german-audiobook-studio.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal web dependencies
        run: python -m pip install -r web/requirements.txt pytest httpx av==18.1.0 soundfile==0.13.1 numpy
      - name: Compile Python adapter
        run: python -m compileall -q tts_audiobook_tool/web_studio
      - name: Web API tests
        run: python -m pytest tests/web -q --confcutdir=tests/web

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
