name: German Audiobook Studio

on:
  pull_request:
    paths:
      - "tts_audiobook_tool/web_studio/**"
      - "tts_audiobook_tool/text_ops/epub_extractor.py"
      - "tts_audiobook_tool/text_ops/epub_content_audit.py"
      - "tts_audiobook_tool/text_ops/german_speech_normalizer.py"
      - "tests/text/test_epub_content_audit.py"
      - "tests/text/test_german_speech_normalizer.py"
      - "docs-dev/epub-content-audit.md"
      - "tests/text/test_epub_extractor.py"
      - "tests/text/test_epub_private_regressions.py"
      - "tts_audiobook_tool/text_ops/epub_section_skip_detector.py"
      - "web/**"
      - "runpod/install-web.sh"
      - "runpod/start-web.sh"
      - "runpod/model-pins.env"
      - "runpod/locks/**"
      - "requirements-qwen3tts.lock.txt"
      - "requirements-moss.lock.txt"
      - "tests/web/**"
      - "runpod/acceptance*.py"
      - "runpod/asr_cpu_smoke.py"
      - ".github/workflows/german-audiobook-studio.yml"
      - ".github/workflows/a03-release-locks.yml"
      - "plan.md"
  push:
    branches:
      - "master"
      - "feature/german-audiobook-*"
    paths:
      - "tts_audiobook_tool/web_studio/**"
      - "tts_audiobook_tool/text_ops/epub_extractor.py"
      - "tts_audiobook_tool/text_ops/epub_content_audit.py"
      - "web/**"
      - "tests/text/test_epub_extractor.py"
      - "tests/text/test_epub_content_audit.py"
      - "tests/web/**"
      - "docs-dev/epub-content-audit.md"
      - "runpod/install-web.sh"
      - "runpod/model-pins.env"
      - ".github/workflows/german-audiobook-studio.yml"

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Install pinned UV and hash-locked Web runtime
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.7"
          uv python install 3.12.16
          uv venv --python 3.12.16 --seed "$RUNNER_TEMP/audiobook-venv"
          uv pip install --python "$RUNNER_TEMP/audiobook-venv/bin/python" --require-hashes --requirement web/requirements-runtime.lock.txt
          uv pip install --python "$RUNNER_TEMP/audiobook-venv/bin/python" --no-deps --require-hashes --requirement web/torch-cpu.lock.txt
          uv pip install --python "$RUNNER_TEMP/audiobook-venv/bin/python" pytest==8.4.2
      - name: Compile Python adapter
        run: |
          "$RUNNER_TEMP/audiobook-venv/bin/python" -m compileall -q tts_audiobook_tool/web_studio runpod/acceptance.py runpod/acceptance_epub.py
      - name: Web API tests
        run: |
          "$RUNNER_TEMP/audiobook-venv/bin/python" -m pytest tests/web -q --confcutdir=tests/web
      - name: EPUB navigation, content audit, attribution and Project-V5 regressions
        run: |
          "$RUNNER_TEMP/audiobook-venv/bin/python" -m pytest -q \
            tests/text/test_epub_extractor.py \
            tests/text/test_epub_content_audit.py \
            tests/text/test_epub_section_skip_detector.py \
            tests/text/test_epub_private_regressions.py
      - name: German TTS pronunciation and checkpoint regressions
        run: |
          "$RUNNER_TEMP/audiobook-venv/bin/python" -m pytest tests/text/test_german_speech_normalizer.py -q

  deployed-web-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Prepare pinned UV binary as in persistent RunPod volume
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.7"
          mkdir -p "$RUNNER_TEMP/audiobook-data/tools/uv-bootstrap/bin"
          ln -s "$(command -v uv)" "$RUNNER_TEMP/audiobook-data/tools/uv-bootstrap/bin/uv"
      - name: Execute actual isolated Web Studio installer
        run: bash runpod/install-web.sh
        env:
          RUNPOD_WORKSPACE: ${{ runner.temp }}
          AUDIOBOOK_DATA_ROOT: ${{ runner.temp }}/audiobook-data
      - name: Confirm idempotent cached second installation
        run: bash runpod/install-web.sh
        env:
          RUNPOD_WORKSPACE: ${{ runner.temp }}
          AUDIOBOOK_DATA_ROOT: ${{ runner.temp }}/audiobook-data
      - name: Start production FastAPI server and verify HTTP readiness
        run: |
          export AUDIOBOOK_STUDIO_DATA_DIR="$RUNNER_TEMP/audiobook-data"
          export AUDIOBOOK_STUDIO_TOKEN="test-standalone-web-runtime-token-more-than-32-chars"
          "$RUNNER_TEMP/audiobook-data/venvs/web/bin/python" -m uvicorn tts_audiobook_tool.web_studio.app:app --host 127.0.0.1 --port 7860 --workers 1 >"$RUNNER_TEMP/web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7860/api/health; then READY=1; break; fi
            if ! kill -0 "$WEB_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat "$RUNNER_TEMP/web.log"; exit 1; fi

  asr-cpu-smoke:
    # Real German speech recognition using eSpeak-NG-synthesized speech, not
    # a mocked Whisper model or a downloaded private audiobook.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Install open-source German synthetic speech and pinned CPU ASR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
          python -m pip install faster-whisper==1.2.1 ctranslate2==4.7.1 'huggingface-hub>=0.25,<2' 'av==18.1.0'
      - name: Cache public Whisper-tiny weights (no private artifacts)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: german-asr-whisper-tiny-v1
      - name: Run real German CPU inference and negative file test
        run: python -m runpod.asr_cpu_smoke

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies from package lock
        run: npm ci --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked Python runtime and test browser
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.7"
          uv python install 3.12.16
          uv venv --python 3.12.16 --seed "$RUNNER_TEMP/audiobook-venv"
          uv pip install --python "$RUNNER_TEMP/audiobook-venv/bin/python" --require-hashes --requirement web/requirements-runtime.lock.txt
          uv pip install --python "$RUNNER_TEMP/audiobook-venv/bin/python" --no-deps --require-hashes --requirement web/torch-cpu.lock.txt
          uv pip install --python "$RUNNER_TEMP/audiobook-venv/bin/python" playwright==1.56.0
          "$RUNNER_TEMP/audiobook-venv/bin/python" -m playwright install --with-deps chromium
      - name: Build the actual production UI from npm lock
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Headless Chromium authenticated end-to-end
        run: |
          "$RUNNER_TEMP/audiobook-venv/bin/python" tests/web/browser_smoke.py
        env:
          PYTHONPATH: .
