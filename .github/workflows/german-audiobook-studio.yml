name: German Audiobook Studio

on:
  pull_request:
    paths:
      - "tts_audiobook_tool/web_studio/**"
      - "web/**"
      - "tests/web/**"
      - "runpod/acceptance*.py"
      - ".github/workflows/german-audiobook-studio.yml"
  push:
    branches:
      - "feature/german-audiobook-*"
    paths:
      - "tts_audiobook_tool/web_studio/**"
      - "web/**"
      - "tests/web/**"
      - ".github/workflows/german-audiobook-studio.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal web dependencies
        run: python -m pip install -r web/requirements.txt pytest httpx av==18.1.0 soundfile==0.13.1 numpy EbookLib==0.18 beautifulsoup4==4.12.3 pysbd==0.3.4 num2words==0.5.14 natsort==8.4.0 librosa==0.11.0 sounddevice==0.5.2 mutagen==1.48.1 textual==8.2.8 pyloudnorm==0.1.1 audiotsm==0.1.2 xxhash==3.5.0 watchdog==6.0.0 wakepy text2num==3.0.1 whisper_normalizer==0.1.12 requests psutil loguru==0.7.3 nvidia-ml-py chardet==5.2.0 metaphone==0.6 prompt-toolkit==3.0.52 "huggingface_hub>=0.25,<2"
      - name: CPU-only Torch for upstream Project-V5 imports
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Compile Python adapter
        run: python -m compileall -q tts_audiobook_tool/web_studio runpod/acceptance.py runpod/acceptance_epub.py
      - name: Web API tests
        run: python -m pytest tests/web -q --confcutdir=tests/web

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python, EPUB and headless browser dependencies
        run: |
          python -m pip install -r web/requirements.txt pytest httpx av==18.1.0 soundfile==0.13.1 numpy EbookLib==0.18 beautifulsoup4==4.12.3 pysbd==0.3.4 num2words==0.5.14 natsort==8.4.0 librosa==0.11.0 sounddevice==0.5.2 mutagen==1.48.1 textual==8.2.8 pyloudnorm==0.1.1 audiotsm==0.1.2 xxhash==3.5.0 watchdog==6.0.0 wakepy text2num==3.0.1 whisper_normalizer==0.1.12 requests psutil loguru==0.7.3 nvidia-ml-py chardet==5.2.0 metaphone==0.6 prompt-toolkit==3.0.52 "huggingface_hub>=0.25,<2" playwright
          python -m playwright install --with-deps chromium
      - name: CPU-only Torch for upstream Project-V5 imports
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Build the actual production UI
        run: cd web && npm install --no-audit --no-fund && npm run build
      - name: Headless Chromium authenticated end-to-end
        run: python tests/web/browser_smoke.py
        env:
          PYTHONPATH: .
